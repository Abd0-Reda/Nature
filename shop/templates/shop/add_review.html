{% extends 'shop/base.html' %}

{% block title %}Add Review{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h3 class="mb-4 text-center">Add a Review for "{{ product.name }}"</h3>

      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-dark w-100 mt-3">Submit</button>
      </form>
    </div>
  </div>
{% endblock %}
